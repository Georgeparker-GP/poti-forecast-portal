name: Fetch Copernicus Wave Data

# ─────────────────────────────────────────────────────────────
# ცალკე pipeline — მთავარ fetch.yml-ს არ ერევა.
#
# მიზეზი: Copernicus-ის პროდუქტი დღეში ორჯერ ახლდება (00/12 UTC), ხოლო
# copernicusmarine თან მოაქვს xarray/dask/netCDF4 — მძიმე დამოკიდებულებები.
# საათობრივ pipeline-ში ჩაშენება ორივეს აზიანებდა: ზედმეტი ინსტალაცია
# ყოველ საათში და ჩავარდნის დამატებითი წერტილი პროგნოზის კრიტიკულ გზაზე.
#
# შედეგი იწერება wave_copernicus.json-ში; fetch.py მხოლოდ კითხულობს.
# თუ ეს workflow ჩავარდა, fetch.py ბოლო კარგ ფაილს იყენებს.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # პროდუქტი 00:00 და 12:00 UTC-ზე ახლდება; ვიღებთ ოდნავ მოგვიანებით,
    # პლუს ორი შუალედური გაშვება უსაფრთხოებისთვის.
    - cron: '40 2,8,14,20 * * *'
  workflow_dispatch:

# ერთდროული გაშვებები ერთმანეთს არ უნდა გადააწერონ
concurrency:
  group: fetch-wave
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install copernicusmarine

      - name: Fetch Copernicus wave data
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
        run: python fetch_wave.py

      - name: Commit wave data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "ცვლილება არ არის — commit გამოტოვებულია"
          else
            git commit -m "Copernicus wave data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # rebase — მთავარმა pipeline-მა შეიძლება ამასობაში data.json დაფიქსიროს
            git pull --rebase --autostash origin main || true
            git push
          fi
