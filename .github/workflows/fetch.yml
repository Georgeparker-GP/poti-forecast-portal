name: Update Weather Data

on:
  # GitHub-ის შიდა `schedule:` ტრიგერი მოშორებულია — საათების განმავლობაში
  # არასტაბილური აღმოჩნდა. ახლა cron-job.org გარედან საიმედოდ "აჭერს" ამ
  # ღილაკს საათში ერთხელ.
  workflow_dispatch:         # ხელით გაშვების ღილაკი + cron-job.org-ის გარეშე ტრიგერი
    inputs:
      force:
        description: 'throttle-ის გამოტოვება (30 წუთზე ადრე განმეორებითი გაშვება)'
        required: false
        default: 'false'

# ⚠ ერთდროული გაშვებები ერთსა და იმავე ფაილებს (data.json, *_cache.json,
#   mta_mail_state.json) ცვლიან. რიგში დგებიან და არ უქმდებიან —
#   გაუქმებული გაშვება Telegram-ის შეტყობინებას ნახევრად გაგზავნილს დატოვებდა.
concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write

# ლოგები და commit-ის სახელი თბილისის დროით. GitHub-ის საკუთარი
# პრეფიქსი (…Z) UTC რჩება. data.json-ს არ ეხება — იქ TBILISI_TZ
# კოდშივე წერია.
env:
  TZ: Asia/Tbilisi

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ⚠ ადრე `event_name == 'workflow_dispatch'` იყო — ყოველთვის true,
          #   რადგან სხვა ტრიგერი აღარ არსებობს. throttle საერთოდ არ მუშაობდა.
          FORCE_REFRESH: ${{ github.event.inputs.force == 'true' }}
        run: python fetch.py

      # ── MTA ბიულეტენების მიღება Gmail-იდან ──
      # Power Automate MTA-ს წერილს Gmail-ზე გადმოაგზავნის დანართით;
      # ეს ბიჯი IMAP-ით იღებს PDF-ებს mta_bulletins/-ში.
      # credentials-ის გარეშე ჩუმად გამოტოვდება.
      - name: Fetch MTA bulletins from Gmail
        continue-on-error: true
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # დაშვებული გამგზავნები (მძიმით). ცარიელზე შემოწმება გამორთულია.
          MTA_ALLOWED_SENDERS: ${{ secrets.MTA_ALLOWED_SENDERS }}
        run: python fetch_mta.py

      # ── MTA ბიულეტენების ingest (observation-only) ──
      # ცალკე კალაპოტი — data.json-ს / კონსენსუსს არ ეხება.
      # continue-on-error: MTA-ს ნებისმიერი პრობლემა (ცუდი PDF, ფორმატის
      # ცვლილება) იზოლირებულია და პორტალის განახლებას არ აზიანებს.
      - name: Ingest MTA bulletins (observation-only)
        run: python mta_ingest.py
        continue-on-error: true

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add -A — ყველა ცვლილება ერთ ბრძანებით:
          #   data.json, *_cache.json, mta_log.json, mta_bulletins/ (წაშლა/დამატება).
          # კონდიციური `&&` ხაზები მოშორებულია — bash-ში ისინი მყიფე იყო
          # (non-zero exit მთელ ბიჯს ჩააგდებდა). -A საიმედოა ამ repo-სთვის,
          # რადგან ყველა ცვალებადი ფაილი სწორედ commit-ის ღირსია.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update weather data - $(date +'%Y-%m-%d %H:%M')"
          # ⚠ `|| true` მოხსნილია: rebase-ის კონფლიქტი ჩუმად იმალებოდა და
          #   ბიჯი მხოლოდ push-ზე ვარდებოდა გაურკვეველი შეცდომით. ახლა
          #   კონფლიქტი აქვე ჩანს და ქვემოთ Telegram-ის backstop ირთვება.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Notify on failure (backstop)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚨 Poti Forecast Portal: hourly update workflow ჩავარდა (Actions). ლოგები: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || true
