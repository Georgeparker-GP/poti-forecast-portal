name: Update Weather Data

on:
  schedule:
    - cron: '0 * * * *'      # ყოველ საათში
  workflow_dispatch:         # ხელით გაშვების ღილაკი

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt python-dotenv requests

      - name: Create .env file
        run: |
          echo "STORMGLASS_API_KEY=${{ secrets.STORMGLASS_API_KEY }}" > .env
          echo "WINDY_API_KEY=${{ secrets.WINDY_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Run fetch script
        run: python fetch.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update weather data - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
