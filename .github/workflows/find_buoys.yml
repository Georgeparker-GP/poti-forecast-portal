name: ბუების ძებნა

on:
  workflow_dispatch:
    inputs:
      radius:
        description: 'რადიუსი კმ-ში'
        required: false
        default: '300'

env:
  TZ: Asia/Tbilisi

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "copernicusmarine>=2.0,<3"
      - name: ძებნა
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
          # input env-ით გადაეცემა და არა `${{ }}`-ით პირდაპირ shell-ში —
          # თორემ ტექსტი ბრძანებად ჩაიხსნებოდა (script injection).
          RADIUS: ${{ github.event.inputs.radius }}
        run: |
          copernicusmarine describe --contains INSITU_BLK || true
          echo "═══════════════════════"
          python3 find_wave_buoys.py "$RADIUS"
