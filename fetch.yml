name: Update Weather Data

on:
  schedule:
    - cron: '*/15 * * * *'   # ყოველ 15 წუთში ვცდით — GitHub ხშირად აგვიანებს/ხტის
                              # scheduled run-ებს; fetch.py თავად აკონტროლებს, რომ
                              # ნამდვილი მუშაობა მაინც ~საათში ერთხელ მოხდეს
  workflow_dispatch:         # ხელით გაშვების ღილაკი

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt python-dotenv requests

      - name: Run fetch script
        env:
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          for f in stormglass_cache.json yr_cache.json status_cache.json sos_cache.json shift_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Update weather data - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull --rebase --autostash || true
          git push

      - name: Notify on failure (backstop)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚨 Poti Forecast Portal: hourly update workflow ჩავარდა (Actions). ლოგები: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || true
