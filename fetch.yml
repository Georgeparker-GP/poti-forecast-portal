name: Update Weather Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch.py
        run: python fetch.py
        env:
          WINDY_API_KEY:       ${{ secrets.WINDY_API_KEY }}
          STORMGLASS_API_KEY:  ${{ secrets.STORMGLASS_API_KEY }}
          OWM_API_KEY:         ${{ secrets.OWM_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json stormglass_cache.json status_cache.json yr_cache.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "weather: update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          
