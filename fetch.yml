name: Update Weather Data

on:
  # GitHub-ის შიდა `schedule:` ტრიგერი მოშორებულია — საათების განმავლობაში
  # არასტაბილური აღმოჩნდა. ახლა cron-job.org გარედან საიმედოდ "აჭერს" ამ
  # ღილაკს საათში ერთხელ.
  workflow_dispatch:         # ხელით გაშვების ღილაკი + cron-job.org-ის გარეშე ტრიგერი

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── დუმილის დეტექტორი: გაშვების დაწყების აღნიშვნა ──
      # საშუალებას აძლევს healthchecks.io-ს გაშვების ხანგრძლივობა გაზომოს.
      # `|| true` — ping-ის ჩავარდნამ პორტალის განახლება არ უნდა შეაფერხოს.
      - name: Healthcheck — start
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt python-dotenv requests pdfplumber

      - name: Run fetch script
        env:
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: python fetch.py

      # ── MTA ბიულეტენების ingest (observation-only) ──
      # ცალკე კალაპოტი — data.json-ს / კონსენსუსს არ ეხება.
      # continue-on-error: MTA-ს ნებისმიერი პრობლემა (ცუდი PDF, ფორმატის
      # ცვლილება) იზოლირებულია და პორტალის განახლებას არ აზიანებს.
      - name: Ingest MTA bulletins (observation-only)
        run: python mta_ingest.py
        continue-on-error: true

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add -A — ყველა ცვლილება ერთ ბრძანებით:
          #   data.json, *_cache.json, mta_log.json, mta_bulletins/ (წაშლა/დამატება).
          # კონდიციური `&&` ხაზები მოშორებულია — bash-ში ისინი მყიფე იყო
          # (non-zero exit მთელ ბიჯს ჩააგდებდა). -A საიმედოა ამ repo-სთვის,
          # რადგან ყველა ცვალებადი ფაილი სწორედ commit-ის ღირსია.
          git add -A
          git commit -m "Update weather data - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull --rebase --autostash || true
          git push

      # ── დუმილის დეტექტორი: წარმატების დადასტურება ──
      # კრიტიკულია, რომ ეს ბოლო ბიჯია — push-ის შემდეგ. ანუ ping ადასტურებს
      # მთელ ჯაჭვს: fetch → commit → push, და არა უბრალოდ სკრიპტის გაშვებას.
      #
      # ლოგიკის შებრუნება: აქამდე ჩავარდნას თავად უნდა ეცნობებინა თავის თავზე,
      # რაც შეუძლებელია, თუ job-მა runner საერთოდ ვერ მიიღო. ახლა სიგნალი
      # თავად სიჩუმეა — ping-ის არარსებობა.
      - name: Healthcheck — success
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HC_URL" || true
          fi

      # ჩავარდნის დაუყოვნებლივი სიგნალი — grace-პერიოდის ლოდინის გარეშე
      - name: Healthcheck — failure
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 "$HC_URL/fail" || true
          fi

      - name: Notify on failure (backstop)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚨 Poti Forecast Portal: hourly update workflow ჩავარდა (Actions). ლოგები: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || true
