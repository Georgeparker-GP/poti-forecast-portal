<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APMT Poti — Weather Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif; }

  /* ═══ INTRO ═══ */
  #intro {
    position: fixed; inset: 0; z-index: 9999; background: #000;
    display: flex; align-items: center; justify-content: center;
  }

  #intro-video {
    width: 100%; height: 100%;
    object-fit: cover;   /* fill screen, crop edges */
    background: #000;
  }

  /* subtle vignette for cinematic depth */
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center,
      transparent 55%, rgba(0,0,0,0.35) 100%);
  }

  /* ── HUD overlay that fades in near the end ── */
  #hud {
    position: absolute; inset: 0; z-index: 6; pointer-events: none;
    opacity: 0;
  }
  #hud.show { animation: hudIn 0.8s ease-out forwards; }
  @keyframes hudIn { to { opacity: 1; } }

  #hud-title {
    position: absolute; left: 50%; bottom: 18%;
    transform: translateX(-50%);
    text-align: center; white-space: nowrap;
  }
  #hud-title .kicker {
    color: rgba(0, 220, 160, 0.9);
    font-size: clamp(10px, 2.4vw, 13px);
    letter-spacing: 0.4em; text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 0 12px rgba(0,220,160,0.5);
  }
  #hud-title .main {
    color: #fff;
    font-size: clamp(22px, 6vw, 44px);
    font-weight: 300; letter-spacing: 0.15em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }
  #hud-title .coords {
    color: rgba(255,255,255,0.6);
    font-size: clamp(9px, 2vw, 12px);
    letter-spacing: 0.25em; margin-top: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* corner brackets */
  .bracket {
    position: absolute; width: clamp(24px,6vw,44px); height: clamp(24px,6vw,44px);
    border-color: rgba(0,220,160,0.55);
  }
  .b-tl { top: 6%; left: 6%; border-top: 1.5px solid; border-left: 1.5px solid; }
  .b-tr { top: 6%; right: 6%; border-top: 1.5px solid; border-right: 1.5px solid; }
  .b-bl { bottom: 6%; left: 6%; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .b-br { bottom: 6%; right: 6%; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  /* ── skip ── */
  #skip {
    position: absolute; bottom: 20px; right: 20px; z-index: 100;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.55); font-size: 11px; letter-spacing: 0.1em;
    padding: 7px 15px; border-radius: 5px; cursor: pointer; transition: all .2s;
  }
  #skip:hover { background: rgba(255,255,255,0.16); color: #fff; }

  /* ── fade out ── */
  #intro.fade-out { animation: introFade 0.8s ease-in forwards; }
  @keyframes introFade { to { opacity: 0; pointer-events: none; } }

  /* ═══ PORTAL PLACEHOLDER ═══ */
  #portal {
    position: fixed; inset: 0; opacity: 0; transition: opacity 0.7s ease;
    background: #0d1821; display: flex; align-items: center; justify-content: center;
  }
  #portal.visible { opacity: 1; }
  #portal-msg { color: rgba(0,220,160,0.8); font-size: 16px; letter-spacing: 0.08em; padding: 20px; text-align:center; }

  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    #portal { opacity: 1; }
  }
</style>
</head>
<body>

<div id="intro">
  <video id="intro-video" playsinline muted autoplay preload="auto">
    <source src="intro.mp4" type="video/mp4">
  </video>

  <div id="vignette"></div>

  <div id="hud">
    <div class="bracket b-tl"></div>
    <div class="bracket b-tr"></div>
    <div class="bracket b-bl"></div>
    <div class="bracket b-br"></div>
    <div id="hud-title">
      <div class="kicker">APMT Terminals</div>
      <div class="main">ფოთის პორტი</div>
      <div class="coords">42°09′N · 41°40′E</div>
    </div>
  </div>

  <button id="skip" onclick="skipIntro()">გამოტოვება ▶</button>
</div>

<div id="portal">
  <div id="portal-msg">✅ ვიდეო-ინტრო მუშაობს<br><br>← აქ ჩაჯდება პორტალის კონტენტი →</div>
</div>

<script>
(function(){
  const intro  = document.getElementById('intro');
  const portal = document.getElementById('portal');
  const video  = document.getElementById('intro-video');
  const hud    = document.getElementById('hud');
  let done = false;

  function finish() {
    if (done) return; done = true;
    intro.classList.add('fade-out');
    portal.classList.add('visible');
    setTimeout(() => { intro.style.display = 'none'; }, 800);
  }
  window.skipIntro = finish;

  // show HUD title in the last ~1.5s of video
  video.addEventListener('timeupdate', () => {
    if (video.duration && video.currentTime >= video.duration - 1.6) {
      hud.classList.add('show');
    }
  });

  // when video ends → transition to portal
  video.addEventListener('ended', () => setTimeout(finish, 400));

  // fallbacks: if video fails to load or autoplay blocked
  video.addEventListener('error', finish);
  setTimeout(() => {
    // safety: if video never played (e.g. mobile autoplay block), skip after 8s
    if (video.paused && video.currentTime === 0) finish();
  }, 8000);

  // hard cap: never hang longer than video + buffer
  setTimeout(finish, 12000);

  // keyboard skip
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === ' ') finish();
  });
})();
</script>
</body>
</html>
