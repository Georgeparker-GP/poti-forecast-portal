<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ფოთის პორტი — კონსენსუს-პორტალი</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: #0a0e17; color: #e5e7eb; font-family: sans-serif; padding: 20px; }
    .card { background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 16px; margin: 10px; display: inline-block; min-width: 200px; }
    .label { font-size: 11px; color: #9ca3af; text-transform: uppercase; }
    .value { font-size: 24px; font-weight: bold; margin: 5px 0; }
</style>
</head>
<body>
    <h1 class="text-xl mb-5">ფოთის პორტი — ამინდის მონიტორინგი</h1>
    
    <div id="dashboard">
        <div class="card">
            <div class="label">ტემპერატურა</div>
            <div class="value" id="c-temp">--</div>
            <div class="label">°C</div>
        </div>
        <div class="card">
            <div class="label">ქარის სიჩქარე</div>
            <div class="value" id="c-wind">--</div>
            <div class="label">მ/წმ</div>
        </div>
        <div class="card">
            <div class="label">ხილვადობა</div>
            <div class="value" id="c-vis">--</div>
            <div class="label">კმ</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                // ?t=... არის კეშის გასასუფთავებელი
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                const c = data.current;
                
                // მონაცემების შევსება
                document.getElementById('c-temp').textContent = c.temperature_2m ? c.temperature_2m.toFixed(1) : '--';
                document.getElementById('c-wind').textContent = c.wind_speed ? c.wind_speed.toFixed(1) : '--';
                document.getElementById('c-vis').textContent = c.visibility_km ? c.visibility_km.toFixed(1) : '--';
                
            } catch (error) {
                console.error("მონაცემების ჩატვირთვის შეცდომა:", error);
            }
        }

        // ავტომატური განახლება ყოველ 60 წამში
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
