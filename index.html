<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ფოთის პორტი — კონსენსუს-პორტალი</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--sf:#111827;--br:rgba(255,255,255,0.07);--mu:#4b5563;--tx:#e5e7eb;--sb:#9ca3af;--gn:#10b981;--yw:#f59e0b;--rd:#ef4444;--bl:#3b82f6;--tl:#14b8a6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans Georgian',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;}
.mono{font-family:'JetBrains Mono',monospace;}
header{background:var(--sf);border-bottom:1px solid var(--br);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:36px;height:36px;border:1px solid rgba(59,130,246,0.4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(59,130,246,0.08);}
.logo h1{font-size:15px;font-weight:600;}
.logo p{font-size:11px;color:var(--sb);margin-top:1px;}
.status-bar{padding:10px 24px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;border-bottom:1px solid var(--br);transition:background .4s;flex-wrap:wrap;}
.status-bar.operational{background:rgba(16,185,129,0.06);color:#6ee7b7;}
.status-bar.warning{background:rgba(245,158,11,0.06);color:#fcd34d;}
.status-bar.suspended{background:rgba(239,68,68,0.06);color:#fca5a5;}
.pulse{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.operational .pulse{background:var(--gn);box-shadow:0 0 6px var(--gn);}
.warning .pulse{background:var(--yw);box-shadow:0 0 6px var(--yw);animation:blink 1.2s infinite;}
.suspended .pulse{background:var(--rd);box-shadow:0 0 6px var(--rd);animation:blink .8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
main{max-width:1280px;margin:0 auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.card{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:16px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:10px 0 0 10px;}
.card.ok::before{background:var(--gn)}.card.warn::before{background:var(--yw)}.card.danger::before{background:var(--rd)}.card.neutral::before{background:var(--mu)}.card.teal::before{background:var(--tl)}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sb);}
.card-value{font-size:28px;font-weight:700;margin:6px 0 2px;font-family:'JetBrains Mono',monospace;line-height:1;}
.card-unit{font-size:12px;color:var(--sb);}
.card-sub{font-size:11px;color:var(--sb);margin-top:4px;}
.card-badge{position:absolute;top:12px;right:12px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;letter-spacing:.05em;}
.badge-ok{background:rgba(16,185,129,.12);color:#6ee7b7}.badge-warn{background:rgba(245,158,11,.12);color:#fcd34d}.badge-danger{background:rgba(239,68,68,.12);color:#fca5a5}
.bar-wrap{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:10px;}
.bar-fill{height:3px;border-radius:2px;transition:width .8s ease;}
.bar-green{background:var(--gn)}.bar-yellow{background:var(--yw)}.bar-red{background:var(--rd)}
.panel{background:var(--sf);border:1px solid var(--br);border-radius:10px;overflow:hidden;}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--br);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.panel-head h3{font-size:14px;font-weight:600;}
.panel-head p{font-size:11px;color:var(--sb);}
svg.chart{width:100%;overflow:visible;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--sb);font-weight:500;padding:10px 12px;text-align:left;border-bottom:1px solid var(--br);background:rgba(255,255,255,.02);}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.03);}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row-danger{background:rgba(239,68,68,.04)}.tbl tr.row-warn{background:rgba(245,158,11,.03)}
.tbl tr.row-now td:first-child{border-left:2px solid var(--tl);padding-left:10px;}
.t-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sb);}
.t-num{font-family:'JetBrains Mono',monospace;font-size:12px;}
.t-rd{color:#fca5a5;font-weight:600}.t-yw{color:#fcd34d;font-weight:600}.t-gn{color:#6ee7b7}.t-mu{color:var(--sb)}
.pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:4px;}
.pill-ok{background:rgba(16,185,129,.12);color:#6ee7b7}.pill-warn{background:rgba(245,158,11,.12);color:#fcd34d}.pill-danger{background:rgba(239,68,68,.15);color:#fca5a5}
.meta-strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--sb);padding:8px 0 4px;}
.chip{background:var(--sf);border:1px solid var(--br);border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tl);}
footer{text-align:center;padding:24px;font-size:11px;color:var(--mu);border-top:1px solid var(--br);margin-top:8px;}

/* ──── tab-ები ──── */
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--br);}
.tab{padding:10px 16px;font-size:12px;font-weight:500;color:var(--sb);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tab.active{color:var(--bl);border-bottom-color:var(--bl);}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚓</div>
    <div>
      <h1>ფოთის პორტი — კონსენსუს-პორტალი</h1>
      <p id="sources-line">მონაცემები იტვირთება...</p>
    </div>
  </div>
  <div style="text-align:right;flex-shrink:0">
    <div style="font-size:11px;color:var(--sb)">ბოლო განახლება</div>
    <div id="update-time" class="mono" style="font-size:13px;color:var(--bl);margin-top:2px">--:--</div>
    <div id="next-time" style="font-size:10px;color:var(--mu);margin-top:1px">შემდეგი: ---</div>
  </div>
</header>

<div id="status-bar" class="status-bar operational">
  <div class="pulse"></div>
  <span id="status-text">სტატუსი იტვირთება...</span>
  <div id="alert-items" style="margin-left:12px;display:flex;gap:10px;flex-wrap:wrap;"></div>
  <span style="margin-left:auto;font-size:11px;color:var(--mu)">განახლება: <span id="cd" style="color:var(--tl)">60</span>წმ</span>
</div>

<main>

  <div class="cards-grid">
    <div class="card neutral" id="card-wind">
      <div class="card-label">ქარის სიჩქარე</div>
      <div class="card
